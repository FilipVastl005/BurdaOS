# BurdaOS — GRUB2 Configuration (BIOS / UEFI)
set default=0
set timeout=5

insmod all_video
insmod font
if loadfont /boot/grub/fonts/unicode.pf2; then
    set gfxmode=auto
    insmod gfxterm
    terminal_output gfxterm
fi

set menu_color_normal=light-gray/black
set menu_color_highlight=white/blue

submenu "BurdaOS — Boot Options" {
    @LINUX_LIVE@
}

@LINUX_LIVE@
