# ==============================================================================
# BurdaOS — Neofetch Telemetry Configuration
# ==============================================================================

print_info() {
    info title
    info underline

    info "OS" distro
    info "Kernel" kernel
    info "Uptime" uptime
    info "Packages" packages
    info "Shell" shell
    info "DE" de
    info "WM" wm
    info "CPU" cpu
    info "Memory" memory

    prin "Upper Thermal Clearance" "50% (Aggressively Aerodynamic)"
    prin "Central Mass Storage" "Over-Provisioned / Well-Buffered"
    prin "Attitude" "110% (Unnecessarily Passive-Aggressive)"
    prin "Resources" "4 Cores / 8GB RAM (Try not to waste all of them at once)"

    info cols
}

title_fqdn="off"
kernel_shorthand="on"
distro_shorthand="off"
os_arch="on"
uptime_shorthand="on"
memory_percent="on"
memory_unit="gib"
package_managers="on"
shell_path="off"
shell_version="on"
speed_type="bios_limit"
cpu_brand="on"
cpu_speed="on"
cpu_cores="logical"
cpu_temp="off"
separator=":"
colors=(4 6 7 4 6 7)
ascii_distro="debian_small"
ascii_colors=(4 6)
bold="on"
underline_enabled="on"
underline_char="-"
